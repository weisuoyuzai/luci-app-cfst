name: Build IPK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # luci-app-cfst has LUCI_PKGARCH:=all (no compiled code), so a single
        # SDK arch is enough to produce an ipk installable on any target.
        arch:
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build luci-app-cfst with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEED_DIR: ${{ github.workspace }}/..
          PACKAGES: luci-app-cfst

      - name: Debug workspace contents
        run: |
          echo "== workspace tree (top levels) =="
          find "$GITHUB_WORKSPACE" -maxdepth 3 | sort
          echo "== any ipk/apk anywhere under workspace parent =="
          find "$GITHUB_WORKSPACE/.." -iname '*.ipk' -o -iname '*.apk' 2>/dev/null
          echo "== luci-app-cfst compile log, if present =="
          find "$GITHUB_WORKSPACE" -path '*luci-app-cfst*compile*' -o -path '*luci-app-cfst*install*' 2>/dev/null
          LOGF=$(find "$GITHUB_WORKSPACE/logs" -path '*luci-app-cfst*' -name '*.txt' 2>/dev/null | head -1)
          if [ -n "$LOGF" ]; then echo "== $LOGF =="; cat "$LOGF"; fi

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cfst-ipk
          # luci-app-cfst has LUCI_PKGARCH:=all, so the SDK places the ipk
          # under bin/packages/all/, not bin/packages/<arch>/.
          path: bin/packages/**/*.ipk
          if-no-files-found: error

      - name: Attach ipk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/**/*.ipk

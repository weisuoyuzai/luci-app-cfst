name: Build IPK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # luci-app-cfst has LUCI_PKGARCH:=all (no compiled code), so a single
        # SDK arch is enough to produce an ipk installable on any target.
        arch:
          - x86_64

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Build luci-app-cfst with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cfst-ipk
          path: bin/packages/${{ matrix.arch }}/**/*.ipk
          if-no-files-found: error

      - name: Attach ipk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/${{ matrix.arch }}/**/*.ipk

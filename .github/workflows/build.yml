name: Build IPK

on:
  push:
    branches: [ master ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ master ]
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.arch }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # luci-app-cfst has LUCI_PKGARCH:=all (no compiled code), so a single
        # SDK arch is enough to produce an ipk installable on any target.
        # Pinned to the 24.10 release line because it's the last one whose
        # SDK still packages as ipk/opkg; 25.12+ and the master snapshot
        # default to the newer apk format instead.
        arch:
          - x86_64-24.10.8

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compile Chinese translation into the package
        run: |
          set -e
          # Ship the zh-cn UI strings inside luci-app-cfst itself instead of
          # a separate luci-i18n-cfst-zh-cn package (see the PACKAGES note
          # below for why that package can't be built here). This compiles
          # po/zh_Hans/cfst.po with po2lmo - the same tool luci.mk itself
          # would use - and drops the resulting .lmo where LuCI's runtime
          # i18n loader expects it, so it gets bundled by the normal `root/`
          # copy step like any other file.
          #
          # po2lmo has no prebuilt binary and isn't split out as its own
          # feed package, so it's built from luci-base's own sources here.
          # Pinned to the openwrt-24.10 branch to match the SDK version above.
          LUCI_REF=openwrt-24.10
          BASE="https://raw.githubusercontent.com/openwrt/luci/$LUCI_REF/modules/luci-base/src"
          work=$(mktemp -d)
          mkdir -p "$work/contrib" "$work/lib"
          curl -fsSL -o "$work/po2lmo.c" "$BASE/po2lmo.c"
          curl -fsSL -o "$work/contrib/lemon.c" "$BASE/contrib/lemon.c"
          curl -fsSL -o "$work/contrib/lempar.c" "$BASE/contrib/lempar.c"
          curl -fsSL -o "$work/lib/lmo.c" "$BASE/lib/lmo.c"
          curl -fsSL -o "$work/lib/lmo.h" "$BASE/lib/lmo.h"
          curl -fsSL -o "$work/lib/plural_formula.y" "$BASE/lib/plural_formula.y"
          cd "$work"
          cc -std=gnu17 -o contrib/lemon contrib/lemon.c
          ./contrib/lemon -q lib/plural_formula.y
          cc -DNDEBUG -o po2lmo po2lmo.c lib/lmo.c lib/plural_formula.c
          install -d "$GITHUB_WORKSPACE/root/usr/lib/lua/luci/i18n"
          ./po2lmo "$GITHUB_WORKSPACE/po/zh_Hans/cfst.po" \
            "$GITHUB_WORKSPACE/root/usr/lib/lua/luci/i18n/cfst.zh-cn.lmo"

      - name: Build luci-app-cfst with the OpenWrt SDK
        uses: openwrt/gh-action-sdk@main
        env:
          ARCH: ${{ matrix.arch }}
          FEED_DIR: ${{ github.workspace }}/..
          # NOTE: luci-i18n-cfst-zh-cn is a "virtual" package - luci.mk
          # registers it via a second BuildPackage call inside this same
          # Makefile rather than its own directory. gh-action-sdk's
          # single-package build mode resolves PACKAGES entries straight to
          # directories (package/<name>/download etc.), so it can't find a
          # virtual package by name and fails with "No rule to make target".
          # Only the real, directory-backed package can be built this way.
          PACKAGES: luci-app-cfst

      - name: Upload ipk artifact
        uses: actions/upload-artifact@v4
        with:
          name: luci-app-cfst-ipk
          path: bin/packages/**/*.ipk
          if-no-files-found: error

      - name: Attach ipk to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: bin/packages/**/*.ipk
